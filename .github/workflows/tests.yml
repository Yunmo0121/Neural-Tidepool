name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install "numpy>=2.0,<3.0"

      - name: Python tests (engine, theory, Python ↔ JavaScript parity)
        run: python -m unittest discover -s tests -v

      - name: JavaScript tests (browser engine)
        run: node --test tests/js/*.test.js
